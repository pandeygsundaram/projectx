<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="12" fill="#18181B"/>
  <rect x="1" y="1" width="62" height="62" rx="11" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Gamepad Icon - Simple and Clean -->
  <g transform="translate(12, 18)">
    <!-- Controller body -->
    <rect x="4" y="8" width="32" height="16" rx="4" fill="none" stroke="#A78BFA" stroke-width="2"/>

    <!-- Left grip -->
    <path d="M4 12 L0 16 L0 20 L4 24" stroke="#A78BFA" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Right grip -->
    <path d="M36 12 L40 16 L40 20 L36 24" stroke="#A78BFA" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- D-pad (left) -->
    <line x1="12" y1="14" x2="12" y2="18" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="16" x2="14" y2="16" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>

    <!-- Buttons (right) - 4 button diamond layout -->
    <circle cx="26" cy="12" r="1.5" fill="#C4B5FD"/>
    <circle cx="30" cy="16" r="1.5" fill="#C4B5FD"/>
    <circle cx="26" cy="20" r="1.5" fill="#C4B5FD"/>
    <circle cx="22" cy="16" r="1.5" fill="#C4B5FD"/>
  </g>
</svg>
