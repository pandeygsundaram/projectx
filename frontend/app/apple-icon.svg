<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" fill="#18181B"/>

  <!-- Gamepad Icon - Scaled up -->
  <g transform="translate(34, 50)">
    <!-- Controller body -->
    <rect x="10" y="22" width="90" height="45" rx="10" fill="none" stroke="#A78BFA" stroke-width="5"/>

    <!-- Left grip -->
    <path d="M10 33 L0 45 L0 56 L10 67" stroke="#A78BFA" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Right grip -->
    <path d="M100 33 L110 45 L110 56 L100 67" stroke="#A78BFA" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- D-pad (left) -->
    <line x1="32" y1="38" x2="32" y2="51" stroke="#C4B5FD" stroke-width="5" stroke-linecap="round"/>
    <line x1="26" y1="44.5" x2="38" y2="44.5" stroke="#C4B5FD" stroke-width="5" stroke-linecap="round"/>

    <!-- Buttons (right) - 4 button diamond layout -->
    <circle cx="72" cy="32" r="4" fill="#C4B5FD"/>
    <circle cx="82" cy="44.5" r="4" fill="#C4B5FD"/>
    <circle cx="72" cy="57" r="4" fill="#C4B5FD"/>
    <circle cx="62" cy="44.5" r="4" fill="#C4B5FD"/>
  </g>
</svg>
